<title>Bitácora Formativa Telesecundaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: una sola columna de trabajo; encabezado fijo con selector de trimestre y pestañas; captura rápida con calificaciones 5–10; matrices por proyecto y disciplina; participaciones continuas y rúbricas por proyecto académico */
:root{
  --bg:#edf1f1; --surface:#ffffff; --surface2:#f5f8f8; --ink:#13222b; --muted:#56656f; --line:#d3dcdf;
  --primary:#134f6e; --primary-ink:#ffffff; --primary-soft:#dceaf1; --accent:#c9820c;
  --l0:#9e3434; --l0bg:#f7e1df; --l1:#b14f17; --l1bg:#fbe7d7; --l2:#806300; --l2bg:#f6edc8;
  --l3:#21734a; --l3bg:#d9efe0; --l4:#1c5c9c; --l4bg:#dbe8f6; --lj:#56656f; --ljbg:#e5eaec;
  --c-LEN:#c2561b; --c-SPC:#1f6fb0; --c-ENS:#2e7d4f; --c-HYC:#9a3b86;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --surface:#172129; --surface2:#1c2730; --ink:#e3eaee; --muted:#98a7b1; --line:#2b3943;
  --primary:#6cb4dc; --primary-ink:#0b1a22; --primary-soft:#1d3442; --accent:#eeb244;
  --l0:#f09a92; --l0bg:#3d2221; --l1:#f2a46e; --l1bg:#3c2818; --l2:#e3c45a; --l2bg:#373018; --l3:#7fd3a0; --l3bg:#173525; --l4:#8dbcf0; --l4bg:#182d45; --lj:#a8b4bc; --ljbg:#26323a;
  --c-LEN:#f08d55; --c-SPC:#6fb0ea; --c-ENS:#71c493; --c-HYC:#d68ac6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#172129; --surface2:#1c2730; --ink:#e3eaee; --muted:#98a7b1; --line:#2b3943;
  --primary:#6cb4dc; --primary-ink:#0b1a22; --primary-soft:#1d3442; --accent:#eeb244;
  --l0:#f09a92; --l0bg:#3d2221; --l1:#f2a46e; --l1bg:#3c2818; --l2:#e3c45a; --l2bg:#373018; --l3:#7fd3a0; --l3bg:#173525; --l4:#8dbcf0; --l4bg:#182d45; --lj:#a8b4bc; --ljbg:#26323a;
  --c-LEN:#f08d55; --c-SPC:#6fb0ea; --c-ENS:#71c493; --c-HYC:#d68ac6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 0;border-bottom:1px solid var(--line)}
.toprow{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end;justify-content:space-between}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

<script>
(()=>{
/* ---------- Catálogos ---------- */
const CAMPOS=[
  {k:'LEN',n:'Lenguajes',c:'Lenguajes'},
  {k:'SPC',n:'Saberes y Pensamiento Científico',c:'Saberes y P. C.'},
  {k:'ENS',n:'Ética, Naturaleza y Sociedades',c:'Ética, N. y S.'},
  {k:'HYC',n:'De lo Humano y lo Comunitario',c:'De lo H. y lo C.'}];
const TIPOS=[
  {k:'actividad',n:'Actividad en clase',p:'A',pl:'Actividades'},
  {k:'tarea',n:'Tarea',p:'T',pl:'Tareas'},
  {k:'participacion',n:'Participación',p:'P',pl:'Participación'},
  {k:'parcial',n:'Producto parcial',p:'PP',pl:'Productos parciales'},
  {k:'producto',n:'Producto final',p:'PF',pl:'Producto final'},
  {k:'evaluacion',n:'Rúbrica, lista de cotejo o examen',p:'E',pl:'Instrumentos'},
  {k:'auto',n:'Autoevaluación / coevaluación',p:'AC',pl:'Auto y coevaluación'},
  {k:'diagnostica',n:'Diagnóstica (no se pondera)',p:'DG',pl:'Diagnóstica'}];
const TMAP={};TIPOS.forEach((t,i)=>TMAP[t.k]={...t,i});
TMAP.disciplina={k:'disciplina',n:'Conducta (registro anterior)',p:'C',pl:'Conducta',i:98,oculto:true};
const tipo=k=>TMAP[k]||{k,n:k,p:'X',pl:k,i:99,oculto:true};
const CALS=[10,9,8,7,6,5];
const CALN={10:'Excelente',9:'Muy bien',8:'Bien',7:'Regular',6:'Suficiente',5:'No suficiente'};
const BTN=['ne',5,6,7,8,9,10,'j'];
const ORD={1:'primer',2:'segundo',3:'tercer'},ORDC={1:'Primero',2:'Segundo',3:'Tercero'};
const NOTA_CAT={fortaleza:'Fortaleza',oportunidad:'Área de oportunidad',socioemocional:'Socioemocional / convivencia',intereses:'Intereses y forma de aprender',apoyo:'Apoyo / BAP',familia:'Familia',general:'General'};
const SUG={
  LEN:'lectura diaria con propósito, escritura de textos breves con revisión entre pares y exposición oral con guion',
  SPC:'resolución de problemas con material concreto, explicar paso a paso su razonamiento y registrar observaciones de experimentos sencillos',
  ENS:'análisis de situaciones de su comunidad, debates guiados con reglas claras y uso de mapas y líneas de tiempo',
  HYC:'trabajo colaborativo con roles definidos, rutinas de autorregulación y actividades de proyecto de vida'};

const Store={mode:'loading',db:null,base:null,q:{},
  async init(){
    let db=null,user=null;
    try{if(window.claude&&window.claude.use){[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      [SAMPLE,DL]=await Promise.all([window.claude.use('sample'),window.claude.use('downloads')]);}}catch(e){}
    let id=null;try{id=user?await user.id():null}catch(e){}
    if(db&&id){
      try{this.db=db;this.base=db.doc('data/users/'+id+'/grupo');await this.loadDb();this.mode='db';normalize();return}
      catch(e){console.warn(e)}
    }
    this.mode='local';const d=LS.get('tsf-data',null);if(d)S={...S,...d};normalize();
  },
  async loadDb(){
    const col=n=>this.base.collection(n).limit(1000).get();
    const [g,r,n,f,p]=await Promise.all([this.base.get(),col('registros'),col('notas'),col('fichas'),col('ppas')]);
    if(g.exists){const d=clone(g.data());S.cfg=d.cfg||S.cfg;S.alumnos=d.alumnos||[];S.grupoTexto=d.grupoTexto||{};S.ejemplo=!!d.ejemplo}
    S.registros=r.docs.map(x=>({...clone(x.data()),id:x.id}));
    S.notas=n.docs.map(x=>({...clone(x.data()),id:x.id}));
    S.ppas=p.docs.map(x=>({...clone(x.data()),id:x.id}));
    S.fichas={};f.docs.forEach(x=>S.fichas[x.id]=clone(x.data()));
  },
  saveLocal:debounce(()=>{if(!LS.set('tsf-data',S))toast('El navegador no permitió guardar. Descarga un respaldo.');Sync.cambio()},400),
  put(path,data){
    if(this.mode!=='db'){this.saveLocal();return Promise.resolve()}
    const ref=this.db.doc(path);
    const p=(this.q[path]||Promise.resolve()).catch(()=>{}).then(()=>ref.set(clone(data)));
    this.q[path]=p;
    return p.catch(e=>{toast(e&&e.code==='quota_exceeded'?'Se llenó el espacio de datos. Descarga un respaldo y elimina registros antiguos.':'No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');throw e});
  },
  del(path){
    if(this.mode!=='db'){this.saveLocal();return Promise.resolve()}
    const ref=this.db.doc(path);
    const p=(this.q[path]||Promise.resolve()).catch(()=>{}).then(()=>ref.delete());
    this.q[path]=p;return p.catch(()=>toast('No se pudo eliminar. Inténtalo de nuevo.'));
  },
  p(col,id){return this.base.path+'/'+col+'/'+id},
  grupoNow(){return this.mode==='db'?this.put(this.base.path,{cfg:S.cfg,alumnos:S.alumnos,grupoTexto:S.grupoTexto,ejemplo:!!S.ejemplo}):this.put()},
  grupo(){deb('grupo',()=>this.grupoNow().catch(()=>{}),700)},
  reg(r){return this.mode==='db'?this.put(this.p('registros',r.id),r):this.put()},
  delReg(id){return this.mode==='db'?this.del(this.p('registros',id)):this.del()},
  nota(n){return this.mode==='db'?this.put(this.p('notas',n.id),n):this.put()},
  delNota(id){return this.mode==='db'?this.del(this.p('notas',id)):this.del()},
  ppa(P){return this.mode==='db'?this.put(this.p('ppas',P.id),P):this.put()},
  delPpa(id){return this.mode==='db'?this.del(this.p('ppas',id)):this.del()},
  ficha(aid){deb('f'+aid,()=>{(this.mode==='db'?this.put(this.p('fichas',aid),S.fichas[aid]||{}):this.put()).then(()=>setStatus('Guardado')).catch(()=>{})},800);setStatus('Guardando…')},
  async bulk(tasks){let i=0;for(const t of tasks){await t();i++;if(i%8===0)toast('Guardando '+i+' de '+tasks.length+'…')}},
  async replaceAll(next){
    const old={registros:S.registros.map(x=>x.id),notas:S.notas.map(x=>x.id),ppas:S.ppas.map(x=>x.id),fichas:Object.keys(S.fichas)};
    S={...S,...next};normalize();
    if(this.mode!=='db'){this.saveLocal();return}
    const t=[];
    for(const col of ['registros','notas','ppas'])old[col].filter(id=>!S[col].some(x=>x.id===id)).forEach(id=>t.push(()=>this.del(this.p(col,id))));
    old.fichas.filter(id=>!S.fichas[id]).forEach(id=>t.push(()=>this.del(this.p('fichas',id))));
    S.ppas.forEach(x=>t.push(()=>this.ppa(x)));
    S.registros.forEach(r=>t.push(()=>this.reg(r)));
    S.notas.forEach(n=>t.push(()=>this.nota(n)));
    Object.keys(S.fichas).forEach(a=>t.push(()=>this.put(this.p('fichas',a),S.fichas[a])));
    t.push(()=>this.grupoNow());
    await this.bulk(t);
  }};

  escribir(txt){return escribirArch(this.dir,ARCH_DRIVE,txt)},

function vTrimestre(){
  if(!activos().length)return sinAlumnos();const t=U.trim,ds=discsTrim(t),modo=ds.length&&U.tmode==='disc'?'disc':'campo';

      return `<tr class="click ${U.sel===a.id?'sel':''}" data-act="sel" data-k="${a.id}"><td class="muted">${i+1}</td><td><b>${esc(a.nombre)}</b></td>${CAMPOS.map(c=>`<td class="c">${cell(calif(a.id,c.k,t))}</td>`).join('')}<td class="c"><b>${f1(p)}</b></td><td class="c">${st.pct==null?'—':st.pct+'%'}</td><td class="c">${st.part}</td>${obsCell(a)}</tr>`}).join('');

  }else{
    const grp=CAMPOS.map(c=>({k:c.k,c:c.c,l:ds.filter(d=>d.c===c.k)})).filter(x=>x.l.length);
    const otros=ds.filter(d=>!CAMPOS.some(c=>c.k===d.c));if(otros.length)grp.push({k:'',c:'Otras',l:otros});
    const cols=grp.flatMap(x=>x.l);

  }
  return `<section class="panel flat"><div class="sec-h"><h2>Evaluación del trimestre ${t}</h2><div class="row"><button class="btn sm" data-act="csvTrim">Descargar concentrado (CSV)</button><button class="btn sm" data-act="htmlTrim">Descargar reporte con observaciones</button></div></div>
  <p class="lead">Calificación de 5 a 10 ${modo==='disc'?'por disciplina':'por campo formativo'}. El número grande es la calificación; el pequeño, el promedio ponderado de las evidencias del trimestre. Ajústala con tu juicio docente en el detalle; las ajustadas llevan *. Toca un alumno para ver su desglose y redactar su observación.</p>

  ${tabla}
  ${U.sel?detalleAl(U.sel,t):''}`;
}
function detalleAl(aid,t){

    ${dc.length?`<div class="dlist">${dc.map(x=>{const kd=califD(aid,x.n,t),ajd=o.ajusteD?.[slug(x.n)];return `<div class="kv"><span>${esc(x.n)}</span><span class="row" style="gap:6px">${cellS(kd)}<small class="muted">${f1(kd.s)}</small><select data-chg="ajusteD" data-aid="${aid}" data-k="${esc(x.n)}" id="ajd-${slug(x.n)}" aria-label="Calificación final de ${esc(x.n)}" style="width:auto;padding:3px 5px">${opts(ajd,kd.auto)}</select></span></div>`}).join('')}</div>`:''}</div>`}).join('');

function modal(h){$('#modal').innerHTML=`<div class="modal" data-act="bg"><div class="box" role="dialog" aria-modal="true">${h}</div></div>`}
function irA(id){setTimeout(()=>{const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'start'})},30)}
const limpiarModos=()=>{U.part=null;U.instForm=null;U.instEval=null;U.decimal=false};

/* ---------- Acciones ---------- */
function fichaDe(aid){return S.fichas[aid]||(S.fichas[aid]={})}
const numK=k=>/^\d+$/.test(k)?+k:k;
const A={
  nav(b){U.view=b.dataset.k;LS.set('tsf-view',U.view);U.confirm=null;limpiarModos();render();window.scrollTo(0,0)},
  trim(b){U.trim=+b.dataset.k;LS.set('tsf-trim',U.trim);limpiarModos();render()},
  /* registrar */
  dCampo(b){const d=U.draft,k=b.dataset.k;d.campos=d.campos.includes(k)?d.campos.filter(x=>x!==k):[...d.campos,k];LS.set('tsf-draft',d);render()},
  dPA(b){U.draft.pa=b.dataset.k;U.draft.disc='';LS.set('tsf-draft',U.draft);render()},
  dDisc(b){const d=U.draft,k=b.dataset.k,inh=draftDiscInh();d.disc=d.disc===k?'':((inh.length===1&&inh[0]===k)?'':k);LS.set('tsf-draft',d);render()},
  dTipo(b){const d=U.draft,k=b.dataset.k,wasP=d.tipo==='participacion',isP=k==='participacion';if(wasP!==isP&&Object.keys(d.valores).length){d.valores={};toast('Se limpiaron las calificaciones al cambiar a o desde participación.')}d.tipo=k;LS.set('tsf-draft',d);render()},
  lv(b){const d=U.draft,a=b.dataset.aid,v=numK(b.dataset.k);if(String(d.valores[a])===String(v))delete d.valores[a];else d.valores[a]=v;refreshList()},
  fill(b){const v=numK(b.dataset.k);activos().forEach(a=>{if(U.draft.valores[a.id]==null)U.draft.valores[a.id]=v});refreshList()},
  clearV(){U.draft.valores={};refreshList()},
  q(b){U.q=+b.dataset.k;render()},
  pPlus(b){const id=b.dataset.aid,v=U.draft.valores[id]||{c:0,s:0};if(v.s==null)v.s=0;v.c++;v.s+=U.q;U.draft.valores[id]=v;refreshList()},
  pMinus(b){const id=b.dataset.aid,v=U.draft.valores[id];if(!v)return;v.s-=v.c?v.s/v.c:0;v.c--;if(v.c<=0)delete U.draft.valores[id];refreshList()},
  async saveReg(){
